<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Carnet de voyage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D6247A">
<script src="firebase-config.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Winky+Rough&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17303D;
    --ink-soft:#4C6472;
    --paper:#FBF7EE;
    --paper-raised:#FFFFFF;
    --line:#E4DCC8;
    --sun:#D4972B;
    --sun-deep:#B87A17;
    --jade:#2F8F7A;
    --sky:#3B6EA5;
    --plum:#8C5BA6;
    --coral:#D9603F;
    --danger:#B4472F;
    --radius:14px;
    --title-font:var(--body-font);
    --body-font:"Winky Rough","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body-font);
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  .app{max-width:640px;margin:0 auto;padding:18px 14px 0;}

  /* ---- Header / trip title ---- */
  .trip-header{
    padding:6px 4px 18px;
    border-bottom:2px solid var(--ink);
    margin-bottom:16px;
  }
  .trip-name{
    font-family:Georgia,"Times New Roman",serif;
    font-size:30px;
    font-weight:700;
    line-height:1.15;
    border:none;background:transparent;color:var(--ink);
    width:100%;padding:2px 0;
    outline:none;
  }
  .trip-sub{
    display:flex;align-items:center;gap:8px;
    margin-top:6px;color:var(--ink-soft);font-size:14px;
  }
  .trip-sub input{
    border:none;background:transparent;color:var(--ink-soft);
    font-size:14px;outline:none;padding:2px 0;flex:1;
  }
  .backup-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .cover-page{
    border:2px solid var(--ink);border-radius:var(--radius);
    padding:16px 16px 14px;margin-bottom:18px;background:var(--paper-raised);
  }
  .cover-title{
    font-family:var(--title-font);font-size:19px;font-weight:700;
    margin-bottom:12px;text-shadow:1.5px 1.5px 0 rgba(0,0,0,.2);
  }
  .cover-section-title{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.03em;margin:14px 0 6px;
    border-top:1px dashed var(--line);padding-top:10px;
  }
  .cover-page .cover-section-title:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .cover-total{
    margin-top:8px;font-size:14px;font-weight:700;color:var(--ink);
    background:#F6F0DE;border-radius:9px;padding:8px 10px;
  }
  .cover-empty{font-size:13px;color:var(--ink-soft);}
  .cover-alerts{display:flex;flex-direction:column;gap:6px;}
  .cover-alert-item{
    font-size:13px;background:#FBEAEA;border:1px solid #F0C6C0;color:#8A3A2B;
    border-radius:8px;padding:6px 9px;
  }
  .backup-btn{
    font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;
    border:1.5px solid var(--line);background:var(--paper-raised);color:var(--ink-soft);
    cursor:pointer;
  }

  /* ---- Day tabs ---- */
  .day-tabs{
    display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    width:92px;
    padding:9px 8px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    font-size:13.5px;font-weight:600;
    white-space:normal;word-break:break-word;text-align:center;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
  }
  .day-tab .num{font-size:11px;font-weight:700;letter-spacing:.03em;opacity:.75;}
  .day-tab.active{
    background:var(--ink);border-color:var(--ink);color:#fff;
  }
  .day-tab.active .num{opacity:.85;}
  .add-day-btn{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:20px;
    border:1.5px dashed var(--ink-soft);
    background:transparent;color:var(--ink-soft);
    font-size:13.5px;font-weight:600;cursor:pointer;
  }

  /* ---- Day panel ---- */
  .day-panel{display:none;}
  .day-panel.active{display:block;}
  .day-title-row{
    display:flex;align-items:center;gap:10px;margin-bottom:4px;
  }
  .day-header-row{
    display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:10px;border-radius:14px;padding:12px 60px 12px 14px;position:relative;
  }
  .day-date-big{
    font-family:var(--title-font);font-size:21px;font-weight:700;line-height:1.2;
    text-shadow:1.5px 1.5px 0 rgba(0,0,0,.25);flex:0 0 auto;
  }
  .day-title-wrap{
    display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right;
  }
  .day-title-big{
    font-family:var(--title-font);font-size:21px;font-weight:700;line-height:1.2;
    text-shadow:1.5px 1.5px 0 rgba(0,0,0,.25);flex:1;
  }
  .day-header-actions{display:flex;gap:2px;flex:0 0 auto;position:absolute;top:10px;right:10px;}
  .day-attention{
    margin-bottom:12px;background:#FFF200;color:#C1121F;
    border-radius:10px;padding:10px 12px;
    font-size:14px;font-weight:800;text-align:justify;
  }
  .day-departure{
    display:inline-block;font-weight:700;font-size:13.5px;
    padding:5px 12px;border-radius:8px;margin-bottom:14px;
  }
  .day-morning{
    font-size:13px;color:var(--ink-soft);margin-bottom:14px;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;text-align:justify;
  }
  .day-evening{
    margin-top:18px;border:1.5px dashed;border-radius:var(--radius);
    padding:12px 14px;background:var(--paper-raised);
  }
  .day-evening-title{font-size:13.5px;font-weight:700;margin-bottom:4px;}
  .day-evening-time{font-size:15px;color:var(--ink);}
  .day-evening-info{font-size:12.5px;color:var(--ink-soft);margin-top:4px;text-align:justify;}
  .day-title{
    font-family:Georgia,serif;font-size:20px;font-weight:700;
    border:none;background:transparent;color:var(--ink);
    outline:none;flex:1;padding:3px 0;
  }
  .day-date{
    border:none;background:transparent;color:var(--sun-deep);
    font-size:13.5px;font-weight:600;outline:none;padding:2px 0;margin-bottom:14px;
  }
  .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    padding:4px;font-size:16px;line-height:1;
  }
  .icon-btn.trash{color:var(--danger);}

  /* ---- Activity cards ---- */
  .activity{
    background:color-mix(in srgb, var(--cat-color,var(--ink-soft)) 7%, white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    border-left:6px solid var(--cat-color,var(--ink-soft));
    padding:14px 15px;
    margin-bottom:12px;
    position:relative;
  }
  .activity-top{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .activity-number{
    flex:0 0 auto;
    width:22px;height:22px;border-radius:50%;
    background:var(--cat-color,var(--ink-soft));color:#fff;
    font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .activity-icon-row{
    display:flex;gap:10px;align-items:center;margin-top:8px;
  }
  .activity-gap{
    font-size:12.5px;color:var(--ink-soft);margin-top:8px;
  }
  .activity-gap b{color:var(--ink);}
  .activity-quickmeta{
    display:flex;gap:14px;flex-wrap:wrap;
    font-size:13.5px;color:var(--ink);margin-top:9px;
  }
  .activity-annulation{
    font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:justify;
  }
  .activity-attention{
    margin-top:9px;background:#FBEAEA;border:1px solid #F0C6C0;
    color:#8A3A2B;border-radius:9px;padding:8px 10px;
    font-size:13.5px;font-weight:600;text-align:justify;
  }
  .activity-block-label{
    font-size:11px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.03em;margin-top:11px;margin-bottom:3px;
  }
  .activity-notes-alt{background:color-mix(in srgb, var(--cat-color,#999) 22%, white);}
  .parking-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:6px;
    background:#fff;font-size:15px;
    margin-right:3px;vertical-align:middle;
  }
  .activity-image{
    width:100%;border-radius:10px;margin-top:9px;display:block;
  }
  .activity-siren{
    font-size:15px;margin-left:4px;
    animation:siren-pulse 1.2s infinite;
  }
  @keyframes siren-pulse{
    0%,100%{opacity:1;} 50%{opacity:.35;}
  }
  .activity-parking{
    margin-top:9px;font-size:13px;color:var(--ink-soft);
    border-top:1px dashed var(--line);padding-top:9px;
  }
  .activity-nextday{
    margin-top:12px;background:#FBF0DC;border:1px solid #EAD8A8;
    border-radius:9px;padding:9px 11px;
    font-size:13.5px;font-weight:700;color:var(--sun-deep);
  }
  .activity-nextday-info{
    margin-top:4px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .activity-time{
    font-size:12.5px;font-weight:700;color:var(--cat-color,var(--ink-soft));
    letter-spacing:.02em;margin-bottom:3px;
  }
  .activity-title{
    font-family:var(--title-font);
    font-size:16.5px;font-weight:700;color:var(--cat-color,var(--ink));
    text-shadow:1px 1px 0 rgba(0,0,0,.22);
  }
  .activity-cat{
    display:inline-block;font-size:10.5px;font-weight:700;
    color:var(--cat-tag-color,var(--ink-soft));
    background:color-mix(in srgb, var(--cat-tag-color,#999) 14%, transparent);
    border-radius:20px;padding:2px 9px;margin-top:5px;
  }
  .option-badge{
    display:inline-block;font-size:10.5px;font-weight:700;
    color:#8A6A1B;background:#FDF0C8;border-radius:20px;padding:2px 9px;
  }
  .activity-icon{
    font-size:19px;line-height:1;flex:0 0 auto;
    width:38px;height:38px;border-radius:50%;
    background:color-mix(in srgb, var(--cat-color,var(--ink-soft)) 18%, white);
    color:var(--cat-color,var(--ink-soft));
    display:flex;align-items:center;justify-content:center;
  }
  .icon-svg{width:20px;height:20px;display:block;}
  .gap-icon{color:var(--cat-color,var(--ink-soft));display:inline-flex;vertical-align:-3px;margin-right:2px;}
  .stat-icon{display:inline-flex;vertical-align:-4px;margin-right:4px;}
  .stat-icon .icon-svg{width:16px;height:16px;}
  .gap-icon .icon-svg{width:15px;height:15px;}
  .activity-subline{
    font-size:12.5px;color:var(--ink-soft);margin-top:6px;
  }
  .day-stats-box{
    border:1.5px solid var(--line);border-radius:var(--radius);
    padding:10px 14px 12px;margin-bottom:14px;background:var(--paper-raised);
  }
  .day-stats-title{
    font-size:11.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.03em;margin-bottom:7px;
  }
  .day-stats{
    display:flex;flex-wrap:wrap;gap:6px 16px;
  }
  .day-stat{
    font-size:12.5px;color:var(--ink-soft);
  }
  .day-stat b{color:var(--ink);}
  .activity-box{
    border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-top:9px;
    background:color-mix(in srgb, var(--cat-color,#999) 8%, white);
  }
  .activity-box > *:first-child{margin-top:0;}

  .stats-group{
    border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-top:8px;background:var(--paper);
  }
  .stats-group-label{
    font-size:10.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.03em;margin-bottom:5px;
  }
  .stats-row{
    display:flex;align-items:center;gap:9px;
    font-size:13px;color:var(--ink);padding:3px 0;
  }
  .stats-icon{
    font-size:16px;width:22px;flex:0 0 auto;text-align:center;
  }

  .activity-actions{display:flex;gap:0px;flex:0 0 auto;}
  .activity-actions .icon-btn{font-size:14px;padding:3px 5px;}
  .activity-address{
    font-size:14px;color:var(--ink-soft);margin-top:9px;
    display:flex;align-items:center;gap:6px;
  }
  .link-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .link-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;text-decoration:none;
    padding:7px 12px;border-radius:9px;
    border:1.5px solid var(--line);color:var(--ink);
  }
  .link-btn.waze{border-color:#7FBFDB;color:#1C6E8C;background:#EAF6FB;}
  .link-btn.maps{border-color:#93C5A4;color:#1E6E4B;background:#EAF7EE;}
  .link-btn.osmand{border-color:#B8A8D9;color:#5B3E96;background:#F2EEFA;}
  .link-btn.ticket{border-color:var(--sun);color:var(--sun-deep);background:#FBF0DC;}
  .link-btn.website{border-color:#9CA9B5;color:var(--ink-soft);background:#EEF1F3;}
  .activity-meta{
    display:flex;gap:16px;margin-top:10px;font-size:13.5px;color:var(--ink-soft);flex-wrap:wrap;
  }
  .activity-meta b{color:var(--ink);}
  .activity-notes{
    margin-top:10px;font-size:13.5px;color:var(--ink);
    background:color-mix(in srgb, var(--cat-color,#999) 14%, white);border-radius:9px;padding:8px 10px;
    white-space:pre-wrap;text-align:justify;
  }
  .empty-day{
    text-align:center;color:var(--ink-soft);font-size:14px;
    padding:36px 10px;border:1.5px dashed var(--line);border-radius:var(--radius);
  }

  .add-activity-btn{
    width:100%;padding:13px;border-radius:var(--radius);
    border:1.5px dashed var(--ink-soft);background:transparent;
    color:var(--ink-soft);font-size:14.5px;font-weight:700;cursor:pointer;
    margin-top:4px;
  }

  /* ---- Modal ---- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(23,48,61,.45);
    z-index:50;align-items:flex-end;justify-content:center;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--paper);width:100%;max-width:640px;
    border-radius:20px 20px 0 0;
    padding:20px 18px 26px;max-height:88vh;overflow-y:auto;
  }
  .modal h3{
    font-family:Georgia,serif;font-size:19px;margin:0 0 16px;color:var(--ink);
  }
  .field{margin-bottom:13px;}
  .field label{
    display:block;font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:none;margin-bottom:5px;
  }
  .field input,.field textarea,.field select{
    width:100%;padding:10px 11px;border-radius:9px;
    border:1.5px solid var(--line);background:var(--paper-raised);
    font-size:14.5px;color:var(--ink);font-family:inherit;outline:none;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .compact-row{flex-wrap:wrap;}
  .compact-field{flex:1 1 68px;min-width:68px;}
  .compact-field input{padding:8px 6px;font-size:13px;text-align:center;}
  .compact-field label{font-size:10.5px;}
  .checkbox-line{
    display:flex;align-items:center;gap:8px;margin-top:8px;
    font-size:13px;color:var(--ink);font-weight:600;cursor:pointer;
  }
  .checkbox-line input{width:auto;}
  .walk-leg-row{position:relative;align-items:center;}
  .walk-leg-plus{
    position:absolute;left:-2px;top:-14px;font-size:14px;font-weight:800;
    color:var(--ink-soft);
  }
  .modal-box{
    border:1.5px solid var(--line);border-radius:12px;
    padding:14px 14px 4px;margin-bottom:16px;background:rgba(0,0,0,.015);
  }
  .onedrive-link{
    display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;
    color:#0364B8;text-decoration:none;
  }
  .onedrive-link:hover{text-decoration:underline;}
  .cat-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .cat-choice{
    padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper-raised);
  }
  .cat-choice.picked{color:#fff;border-color:transparent;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:13px;border-radius:11px;border:none;
    font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn.delete{background:#F7E4DE;color:var(--danger);}

  .save-hint{
    text-align:center;font-size:11.5px;color:var(--ink-soft);opacity:.7;
    margin-top:22px;padding-bottom:10px;
  }
  .sync-note{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;text-align:justify;}
  .sync-status{font-size:13.5px;font-weight:700;margin-bottom:12px;}
  .sync-code{width:100%;padding:10px 11px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-family:monospace;background:var(--paper-raised);color:var(--ink);}
  .sync-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
  .sync-row .btn{flex:1 1 130px;}
</style>
</head>
<body>
<div class="app">

  <div class="trip-header">
    <input class="trip-name" id="tripName" placeholder="Nom du voyage" />
    <div class="trip-sub">
      <span>📍</span>
      <input id="tripPlace" placeholder="Destination (ex. Lisbonne, Portugal)" />
    </div>
    <div class="backup-row">
      <button class="backup-btn" onclick="exportData()">⬇️ Sauvegarder une copie</button>
      <button class="backup-btn" onclick="document.getElementById('importFileInput').click()">⬆️ Restaurer une copie</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="importData(this.files[0])" />
      <button class="backup-btn" onclick="newTrip()">🆕 Nouveau voyage</button>
      <button class="backup-btn" id="syncBtn" onclick="openSyncModal()">☁️ Synchro</button>
    </div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div id="dayPanels"></div>

  <div class="save-hint" id="saveHint">Tout est enregistré automatiquement sur cet appareil.</div>
</div>

<!-- Modal Jour -->
<div class="overlay" id="dayOverlay">
  <div class="modal">
    <h3 id="dayModalTitle">Nouveau jour</h3>
    <div class="field">
      <label>Titre du jour</label>
      <input id="fDayTitle" placeholder="Ex. Arrivée à Lisbonne" />
    </div>
    <div class="field">
      <label>Date</label>
      <input id="fDayDate" type="date" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Départ souhaité</label>
        <input id="fDayDeparture" type="time" />
      </div>
      <div class="field">
        <label>Météo</label>
        <input id="fDayWeather" placeholder="Ex. 22 à 28°C" />
      </div>
    </div>
    <div class="field">
      <label>⚠️ Attention (affiché en haut de la journée)</label>
      <input id="fDayAttention" placeholder="Ex. Passeport à ne pas oublier" />
    </div>
    <div class="field">
      <label>🛏️ Adresse de départ ce matin (nuit précédente)</label>
      <input id="fDayMorningAddress" placeholder="Ex. adresse de l'hôtel où vous avez dormi" />
    </div>
    <div class="field" style="font-size:12px;color:var(--ink-soft);">
      ℹ️ Les trajets en voiture, à pied et la durée des activités sont calculés automatiquement à partir de vos activités.
    </div>
    <div class="field">
      <label>Couleur du jour</label>
      <div class="cat-picker" id="dayColorPicker"></div>
    </div>
    <div class="field" style="border-top:1.5px dashed var(--line);padding-top:14px;">
      <label>🏠 ☛ Demain départ vers :</label>
      <input id="fDayNextDeparture" type="time" />
      <input id="fDayNextInfo" placeholder="Petite info pour demain matin" style="margin-top:8px;" />
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeDayModal()">Annuler</button>
      <button class="btn primary" onclick="saveDay()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal Activité -->
<div class="overlay" id="actOverlay">
  <div class="modal">
    <h3 id="actModalTitle">Nouvelle activité</h3>

    <div class="modal-box">
      <div class="field">
        <label>Titre de l'activité</label>
        <input id="fTitle" placeholder="Ex. Visite du Château São Jorge" />
      </div>

      <label class="checkbox-line">
        <input type="checkbox" id="fCountInTotals" checked />
        <span>🔀 Compter dans les totaux (décochez si c'est une option / un choix parmi plusieurs possibles à la même heure, non retenu pour l'instant)</span>
      </label>

      <label class="checkbox-line">
        <input type="checkbox" id="fSurprise" onchange="toggleSurprisePasswordField()" />
        <span>🎁 Effet surprise (titre et détails masqués tant qu'on n'entre pas le mot de passe)</span>
      </label>
      <div class="field" id="surprisePasswordField" style="display:none;">
        <label>Mot de passe pour révéler</label>
        <input id="fSurprisePassword" placeholder="Ex. 1234" />
      </div>

      <div class="field">
        <label>Catégorie</label>
        <div class="cat-picker" id="catPicker"></div>
      </div>

      <div class="field">
        <label>Icône à afficher</label>
        <select id="fIcon"></select>
      </div>

      <div class="field">
        <label id="lblWalkFrom">Depuis l'activité précédente</label>
        <div id="walkLegsContainer"></div>
        <button type="button" class="btn ghost" style="margin-top:6px;padding:6px 12px;font-size:13px;width:auto;" onclick="addWalkLeg()">+ Ajouter un moyen de transport</button>
      </div>
    </div>

    <div class="modal-box">
      <div class="field">
        <label>Adresse</label>
        <input id="fAddress" placeholder="Ex. R. de Santa Cruz, Lisbonne" />
      </div>

      <div class="field">
        <label>🅿️ Parking</label>
        <div class="field-row">
          <div class="field" style="flex:0 0 120px;">
            <select id="fParkingType">
              <option value="">— Aucun —</option>
              <option value="gratuit">Gratuit</option>
              <option value="payant">Payant</option>
              <option value="inconnu">?</option>
            </select>
          </div>
          <div class="field">
            <input id="fParkingPrice" placeholder="Tarif si payant" />
          </div>
        </div>
        <textarea id="fParkingAddresses" placeholder="Une ou plusieurs adresses de parking (une par ligne)"></textarea>
      </div>
    </div>

    <div class="modal-box">
      <div class="field-row compact-row">
        <div class="field compact-field">
          <label>Début</label>
          <input id="fTimeStart" type="time" />
        </div>
        <div class="field compact-field">
          <label>Fin</label>
          <input id="fTimeEnd" type="time" />
        </div>
        <div class="field compact-field">
          <label>⏳ Durée</label>
          <input id="fDuration" placeholder="1h35 ou de 14h à 16h" />
        </div>
      </div>

      <div class="field">
        <label>Tarif</label>
        <div class="field-row">
          <div class="field compact-field" style="flex:0 0 90px;">
            <input id="fPrice" placeholder="15€" oninput="updateCashbackPreview()" />
          </div>
          <div class="field">
            <select id="fPriceType">
              <option value="">— Type de tarif —</option>
              <option value="personne">Par personne</option>
              <option value="2">Pour tous les 2</option>
              <option value="3">Pour tous les 3</option>
              <option value="enfant">Tarif enfant</option>
              <option value="adulte">Tarif adulte</option>
              <option value="famille">Tarif famille</option>
            </select>
          </div>
        </div>
        <div class="field-row" style="margin-top:8px;">
          <div class="field" style="flex:0 0 105px;">
            <select id="fPaymentMethod">
              <option value="">— Moyen —</option>
              <option value="cb">💳 CB</option>
              <option value="cash">💵 Cash</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="field" style="flex:0 0 125px;">
            <select id="fPaymentStatus">
              <option value="">— Statut —</option>
              <option value="paye">✅ Déjà payé</option>
              <option value="surplace">🕓 À payer sur place</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="field">
            <input id="fPaymentOther" placeholder="Autres infos (précisions)" />
          </div>
        </div>
      </div>

      <div class="field">
        <label>Annulation</label>
        <input id="fCancellation" placeholder="Ex. Non remboursable / Gratuit jusqu'à 24h avant" />
      </div>

      <div class="field">
        <label>💸 Cashback</label>
        <div class="field-row">
          <div class="field">
            <input id="fCashbackSite" placeholder="Site (ex. iGraal, Poulpeo...)" />
          </div>
          <div class="field compact-field" style="flex:0 0 70px;">
            <input id="fCashbackPercent" placeholder="%" type="number" step="0.1" oninput="updateCashbackPreview()" />
          </div>
          <div class="field compact-field" style="flex:0 0 100px;">
            <input id="fCashbackAmount" placeholder="Montant" oninput="pickedCashbackManual=true;" />
          </div>
        </div>
        <div id="cashbackPreviewLine" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div>
      </div>
    </div>

    <div class="modal-box">
      <div class="field">
        <label>⚠️ Attention</label>
        <input id="fAttention" placeholder="Ex. Vérifier les horaires avant de partir" />
      </div>

      <label class="checkbox-line">
        <input type="checkbox" id="fAlert" />
        <span>🚨 Il reste quelque chose à faire / prévoir pour cette activité</span>
      </label>
    </div>

    <div class="field">
      <label>🥾 Randonnée (durée et distance à pied)</label>
      <input id="fHike" placeholder="Ex. 2h30 - 8km" />
    </div>

    <div class="field">
      <label>Photo</label>
      <input id="fImageInput" type="file" accept="image/*" onchange="handleImageFile(this.files[0])" />
      <div id="fImagePreviewWrap" style="display:none;margin-top:8px;">
        <img id="fImagePreview" style="max-width:100%;border-radius:10px;" />
        <button type="button" class="btn ghost" style="margin-top:6px;" onclick="removePickedImage()">Retirer la photo</button>
      </div>
    </div>

    <div class="field">
      <label>Lien billet ou carte</label>
      <input id="fTicket" placeholder="https://..." />
      <a href="https://onedrive.live.com" target="_blank" rel="noopener" class="onedrive-link">☁️ Ouvrir OneDrive pour récupérer un lien</a>
    </div>

    <div class="field">
      <label>Web</label>
      <input id="fWebsite" placeholder="https://..." />
    </div>

    <div class="field" id="bookingPlatformField" style="display:none;">
      <label>Plateforme de réservation</label>
      <select id="fBookingPlatform">
        <option value="">— Choisir —</option>
        <option value="booking">🛎️ Booking.com</option>
        <option value="airbnb">🏡 Airbnb</option>
        <option value="abritel">🔑 Abritel / Vrbo</option>
        <option value="expedia">✈️ Expedia</option>
        <option value="hotels">🏨 Hotels.com</option>
        <option value="direct">📞 Réservation directe</option>
        <option value="autre">Autre</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Nom du site/lieu</label>
        <input id="fSiteName" placeholder="Ex. Office de tourisme" />
      </div>
      <div class="field">
        <label>N° de tél</label>
        <input id="fPhone" type="tel" placeholder="Ex. +351 21 123 4567" />
      </div>
    </div>

    <div class="field">
      <label>Informations</label>
      <textarea id="fInfo" placeholder="Ex. Réserver 30 min avant, apporter passeport..."></textarea>
    </div>

    <div class="field">
      <label>Un peu de culture...</label>
      <textarea id="fNotes" placeholder="Vos notes personnelles"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn delete" id="actDeleteBtn" onclick="deleteActivity()" style="display:none;">Supprimer</button>
      <button class="btn ghost" onclick="closeActModal()">Annuler</button>
      <button class="btn primary" onclick="saveActivity()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal Synchronisation -->
<div class="overlay" id="syncOverlay">
  <div class="modal">
    <h3>☁️ Synchronisation</h3>
    <div id="syncBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeSyncModal()">Fermer</button>
    </div>
  </div>
</div>

function parseDurationMinutes(str){
  if(!str) return 0;
  const h = str.match(/(\d+)\s*h\s*(\d+)?/i);
  if(h){ return parseInt(h[1],10)*60 + (h[2]?parseInt(h[2],10):0); }
  const m = str.match(/(\d+)\s*(?:min|mn|')/i);
  if(m){ return parseInt(m[1],10); }
  const n = str.match(/(\d+)/);
  return n ? parseInt(n[1],10) : 0;
}
function parseDistanceMeters(str){
  if(!str) return 0;
  const km = str.match(/(\d+(?:[.,]\d+)?)\s*km/i);
  if(km){ return Math.round(parseFloat(km[1].replace(',','.'))*1000); }
  const m = str.match(/(\d+(?:[.,]\d+)?)\s*m\b/i);
  if(m){ return Math.round(parseFloat(m[1].replace(',','.'))); }
  return 0;
}
function formatMinutes(total){
  if(total<=0) return '';
  const h = Math.floor(total/60), m = total%60;
  if(h>0 && m>0) return `${h}h${String(m).padStart(2,'0')}`;
  if(h>0) return `${h}h`;
  return `${m}'`;
}
function formatMeters(total){
  if(total<=0) return '';
  if(total>=1000) return (total/1000).toFixed(total%1000===0?0:1).replace('.',',')+'km';
  return total+'m';
}
function parseDurationRange(str){
  if(!str) return {min:0, max:0};
  const parts = str.split(/\s+à\s+/i);
  if(parts.length === 2){
    const min = parseDurationMinutes(parts[0]);
    const max = parseDurationMinutes(parts[1]);
    if(min || max) return {min, max: max||min};
  }
  const single = parseDurationMinutes(str);
  return {min: single, max: single};
}

function computeDayTotals(d){
  let durMinMin=0, durMinMax=0, carDur=0, carDist=0, footDur=0, footDist=0;
  (d.activities||[]).forEach(a=>{
    if(a.countInTotals === false) return;
    const dr = parseDurationRange(a.duration);
    durMinMin += dr.min; durMinMax += dr.max;
    const gapDur = parseDurationMinutes(a.walk);
    const gapDist = parseDistanceMeters(a.walk);
    if(a.walkTransport === 'voiture'){ carDur += gapDur; carDist += gapDist; }
    else if(!a.walkTransport || a.walkTransport === 'marche'){ footDur += gapDur; footDist += gapDist; }
    if(a.hike){ footDur += parseDurationMinutes(a.hike); footDist += parseDistanceMeters(a.hike); }
  });
  return {durMinMin, durMinMax, carDur, carDist, footDur, footDist};
}

function parsePriceRange(str){
  if(!str) return {min:0, max:0};
  if(/gratuit/i.test(str)) return {min:0, max:0};
  let s = str;
  let multiplier = 1;
  const xMatch = s.match(/x\s*(\d+)/i);
  if(xMatch){ multiplier = parseInt(xMatch[1],10); s = s.replace(xMatch[0],''); }
  const nums = [...s.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m=>parseFloat(m[1].replace(',','.')));
  if(nums.length===0) return {min:0, max:0};
  if(nums.length===1) return {min:nums[0]*multiplier, max:nums[0]*multiplier};
  return {min:nums[0]*multiplier, max:nums[1]*multiplier};
}
function formatEuros(n){
  if(!n) return '0€';
  const rounded = Math.round(n*100)/100;
  let s = rounded.toFixed(2).replace('.',',');
  s = s.replace(/,00$/,'');
  return s+'€';
}
function formatBudget(b){
  return b.min===b.max ? formatEuros(b.min) : `de ${formatEuros(b.min)} à ${formatEuros(b.max)}`;
}

function computeCashbackAmount(price, percent){
  const pct = parseFloat(String(percent).replace(',','.'));
  if(!pct) return '';
  const pr = parsePriceRange(price);
  if(pr.min===0 && pr.max===0) return '';
  const min = pr.min*pct/100, max = pr.max*pct/100;
  return min===max ? formatEuros(min) : `de ${formatEuros(min)} à ${formatEuros(max)}`;
}

function computeTripSummary(){
  let carDur=0, carDist=0, footDur=0, footDist=0;
  const budget = {
    hebergement:{min:0,max:0}, transport:{min:0,max:0},
    repas:{min:0,max:0}, activites:{min:0,max:0}
  };
  const alerts = [];
  state.days.forEach(d=>{
    const t = computeDayTotals(d);
    carDur += t.carDur; carDist += t.carDist;
    footDur += t.footDur; footDist += t.footDist;
    (d.activities||[]).forEach(a=>{
      if(a.alert){
        alerts.push({ title: a.title || 'Sans titre', dayLabel: d.date ? formatDate(d.date) : (d.title || 'Jour') });
      }
      if(a.countInTotals === false) return;
      const pr = parsePriceRange(a.price);
      let bucket = 'activites';
      if(a.category === 'hebergement') bucket = 'hebergement';
      else if(a.category === 'transport') bucket = 'transport';
      else if(a.category === 'repas') bucket = 'repas';
      budget[bucket].min += pr.min; budget[bucket].max += pr.max;
    });
  });
  return {carDur, carDist, footDur, footDist, budget, alerts};
}

function renderCoverPageContent(){
  const s = computeTripSummary();
  const totalMin = s.budget.hebergement.min + s.budget.transport.min + s.budget.repas.min + s.budget.activites.min;
  const totalMax = s.budget.hebergement.max + s.budget.transport.max + s.budget.repas.max + s.budget.activites.max;
  const ic = (id)=>`<span class="stat-icon">${renderIconSvg(id)}</span>`;

  let html = `<div class="cover-title">📋 Récap' du voyage</div>`;

  html += `<div class="cover-section-title">${ic('voiture')}Trajets totaux du séjour</div><div class="day-stats">`;
  if(s.carDur>0 || s.carDist>0) html += `<div class="day-stat">${ic('voiture')}Voiture : <b>${[formatMinutes(s.carDur),formatMeters(s.carDist)].filter(Boolean).join(' - ')}</b></div>`;
  if(s.footDur>0 || s.footDist>0) html += `<div class="day-stat">${ic('marche')}À pied : <b>${[formatMinutes(s.footDur),formatMeters(s.footDist)].filter(Boolean).join(' - ')}</b></div>`;
  if(s.carDur<=0 && s.carDist<=0 && s.footDur<=0 && s.footDist<=0) html += `<div class="cover-empty">Rien à calculer pour l'instant.</div>`;
  html += `</div>`;

  html += `<div class="cover-section-title">💶 Budget estimé</div><div class="day-stats">
    <div class="day-stat">${ic('hebergement')}Hébergement : <b>${formatBudget(s.budget.hebergement)}</b></div>
    <div class="day-stat">${ic('visite')}Activités : <b>${formatBudget(s.budget.activites)}</b></div>
    <div class="day-stat">${ic('voiture')}Transport : <b>${formatBudget(s.budget.transport)}</b></div>
    <div class="day-stat">${ic('repas')}Alimentation : <b>${formatBudget(s.budget.repas)}</b></div>
  </div>
  <div class="cover-total">💰 Total estimé : ${totalMin===totalMax ? formatEuros(totalMin) : `de ${formatEuros(totalMin)} à ${formatEuros(totalMax)}`}</div>`;

  html += `<div class="cover-section-title">🚨 Alertes en attente</div>`;
  if(s.alerts.length===0){
    html += `<div class="cover-empty">Aucune alerte pour l'instant.</div>`;
  } else {
    html += `<div class="cover-alerts">` + s.alerts.map(a=>`<div class="cover-alert-item">🚨 <b>${escapeHtml(a.title)}</b> — ${escapeHtml(a.dayLabel)}</div>`).join('') + `</div>`;
  }

  return html;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadState(){
  try{
    const raw = localStorage.getItem('trip-data-v2');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    // pas encore de donnée sauvegardée
  }
  if(state.days.length === 0){
    state.days.push({id:uid(), title:'Jour 1', date:'', color:nextDayColor(0), activities:[]});
  }
  if(state.paletteVersion !== 2){
    state.days.forEach((d,i)=>{ d.color = nextDayColor(i); });
    state.paletteVersion = 2;
    saveState();
  }
  activeDayId = '__cover__';
  render();
}

let deferredRemote = null;
let deferredTimer = null;

function saveState(){
  deferredRemote = null; // une modification locale l'emporte sur une mise à jour distante en attente
  try{
    localStorage.setItem('trip-data-v2', JSON.stringify(state));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
  try{
    if(localStorage.getItem('trip-sync-code')) localStorage.setItem('trip-sync-dirty', String(Date.now()));
  }catch(e){}
  if(typeof window.__syncSchedule === 'function') window.__syncSchedule();
}

/* ---------- Synchronisation en temps réel (Firebase) ---------- */
function getSyncPayload(){
  const copy = JSON.parse(JSON.stringify(state));
  (copy.days||[]).forEach(d=>(d.activities||[]).forEach(a=>{ if(a.image) a.image = ''; })); // les photos restent sur l'appareil
  return JSON.stringify(copy);
}
function syncBlocked(){
  const modal = document.querySelector('#actOverlay.active, #dayOverlay.active');
  const ae = document.activeElement;
  return !!modal || !!(ae && (ae.id === 'tripName' || ae.id === 'tripPlace'));
}
function applyRemoteState(json){
  deferredRemote = json;
  tryApplyRemote();
}
function tryApplyRemote(){
  clearTimeout(deferredTimer);
  if(deferredRemote === null) return;
  if(syncBlocked()){ deferredTimer = setTimeout(tryApplyRemote, 1500); return; }
  let remote;
  try{ remote = JSON.parse(deferredRemote); }catch(e){ deferredRemote = null; return; }
  deferredRemote = null;
  if(!remote || !Array.isArray(remote.days) || remote.days.length === 0) return;
  const imgs = {};
  state.days.forEach(d=>(d.activities||[]).forEach(a=>{ if(a.image) imgs[a.id] = a.image; }));
  remote.days.forEach(d=>(d.activities||[]).forEach(a=>{ if(imgs[a.id] && !a.image) a.image = imgs[a.id]; }));
  state = remote;
  try{ localStorage.setItem('trip-data-v2', JSON.stringify(state)); }catch(e){}
  if(activeDayId !== '__cover__' && !state.days.find(d=>d.id === activeDayId)) activeDayId = '__cover__';
  render();
}

function renderSyncModal(){
  const body = document.getElementById('syncBody');
  const s = window.__sync;
  const note = (t)=>`<p class="sync-note">${t}</p>`;
  if(!s || s.status === 'loading'){
    body.innerHTML = note("Chargement du service de synchronisation… Si ce message reste affiché, vérifiez votre connexion internet puis rouvrez l'appli.");
    return;
  }
  if(s.status === 'unconfigured'){
    body.innerHTML = note("La synchronisation n'est pas encore activée : il manque les identifiants Firebase dans le fichier <b>firebase-config.js</b>.");
    return;
  }
  if(s.status === 'unavailable'){
    body.innerHTML = note("Impossible de joindre le service de synchronisation (pas de connexion ?). Réessayez avec du réseau." + (s.detail ? `<br><small>${escapeHtml(s.detail)}</small>` : ''));
    return;
  }
  if(!s.code){
    body.innerHTML =
      (s.status === 'notfound' ? '<p class="sync-status" style="color:var(--danger);">Aucun voyage trouvé avec ce code.</p>' : '') +
      note('Partagez ce voyage pour le retrouver en direct sur votre téléphone et sur votre PC.') +

      '<button class="btn ghost" style="width:100%;" onclick="syncJoin()">Rejoindre ce voyage</button>';
    return;
  }
  const texts = {
    connecting: 'Connexion en cours…',
    on: '✅ Synchronisé en direct',
    offline: '📴 Hors ligne : vos modifications partiront dès le retour du réseau',
    toobig: '⚠️ Voyage trop volumineux pour être synchronisé',
    error: '⚠️ Erreur de synchronisation' + (s.detail ? ' (' + s.detail + ')' : '')
  };
  body.innerHTML = `
    <div class="sync-status">${escapeHtml(texts[s.status] || s.status)}</div>

      <button class="btn primary" onclick="syncCopy(syncShareLink(window.__sync.code), 'Lien copié')">Copier le lien</button>
      <button class="btn ghost" onclick="syncCopy(window.__sync.code, 'Code copié')">Copier le code</button>
    </div>

    <button class="btn delete" style="width:100%;" onclick="syncStop()">Arrêter la synchronisation sur cet appareil</button>`;

function syncCreate(){

function syncJoin(){
  const raw = (document.getElementById('syncJoinInput').value || '').trim();
  let code = raw;
  const m = raw.match(/code=([a-z0-9]+)/i);
  if(m) code = m[1];
  code = code.toLowerCase();
  if(!/^[a-z0-9]{16,40}$/.test(code)){ alert('Ce code ne semble pas valide.'); return; }
  if(!confirm("Les données de cet appareil seront remplacées par le voyage partagé. Faites d'abord une sauvegarde si besoin. Continuer ?")) return;
  if(window.__syncJoin) window.__syncJoin(code);
}
function syncStop(){

}
function syncCopy(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert(okMsg)).catch(()=>{ prompt('Copiez ce texte :', text); });
  } else {
    prompt('Copiez ce texte :', text);
  }
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateTag = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `sauvegarde-voyage-${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert("La sauvegarde n'a pas pu être créée.");
  }
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.days)) throw new Error('format invalide');
      const syncNote = (window.__sync && window.__sync.code) ? '\n\nAttention : ce voyage est partagé, la sauvegarde remplacera aussi le voyage sur vos autres appareils.' : '';
      if(!confirm('Remplacer les données actuelles par cette sauvegarde ?' + syncNote)) return;
      state = parsed;
      saveState();
      activeDayId = '__cover__';
      render();
      alert('Sauvegarde restaurée avec succès.');
    }catch(err){
      alert("Ce fichier n'est pas une sauvegarde valide.");
    }
  };
  reader.readAsText(file);
  document.getElementById('importFileInput').value = '';
}

function renderDayStatsBar(d, dc){
  const stats = [];
  const totals = computeDayTotals(d);
  const ic = (id)=>`<span class="stat-icon">${renderIconSvg(id)}</span>`;
  if(totals.carDur>0 || totals.carDist>0){
    stats.push(`${ic('voiture')}Voiture : <b>${[formatMinutes(totals.carDur),formatMeters(totals.carDist)].filter(Boolean).join(' - ')}</b>`);
  }
  let actLabel = '';

    actLabel = totals.durMinMin === totals.durMinMax
      ? formatMinutes(totals.durMinMax)

  }
  if(actLabel) stats.push(`${ic('calendar')}Activités : <b>${actLabel}</b>`);
  if(totals.footDur>0 || totals.footDist>0){

function isAutoUnlocked(dayDate, timeStart){
  if(!dayDate || !timeStart) return false;
  const target = new Date(`${dayDate}T${timeStart}:00`);
  if(isNaN(target.getTime())) return false;
  return Date.now() >= (target.getTime() - 10*60*1000);
}
function prevActivityLabel(prev, dayDate){
  if(!prev) return '';
  const locked = !!prev.surprise && !unlockedSurprises.has(prev.id) && !isAutoUnlocked(dayDate, prev.timeStart);
  return locked ? 'la surprise' : prev.title;
}

    if(a.cashbackSite || a.cashbackPercent || a.cashbackAmount){
      const amount = a.cashbackPercent ? (computeCashbackAmount(a.price, a.cashbackPercent) || a.cashbackAmount) : a.cashbackAmount;
      const pctTxt = a.cashbackPercent ? ` (${escapeHtml(String(a.cashbackPercent))}%)` : '';
      paymentBlock += `<div class="activity-annulation">💸 Cashback${pctTxt} : <b>${escapeHtml(a.cashbackSite||'')}${a.cashbackSite&&amount?' — ':''}${escapeHtml(amount||'')}</b></div>`;
    }
    hikeBlock = a.hike ? `<div class="activity-annulation">🥾 Randonnée : <b>${escapeHtml(a.hike)}</b></div>` : '';
    cancellationBlock = a.cancellation ? `<div class="activity-annulation">🔁 Annulation : <b>${escapeHtml(a.cancellation)}</b></div>` : '';
    attentionBlock = a.attention ? `<div class="activity-attention">⚠️ ${escapeHtml(a.attention)}</div>` : '';
    if(a.ticket || a.website || a.siteName || a.phone){
      linksBlock = `<div class="link-row">
        ${a.ticket ? `<a class="link-btn ticket" href="${escapeAttr(a.ticket)}" target="_blank" rel="noopener">🎫 Voir mon billet</a>` : ''}
        ${a.website ? `<a class="link-btn website" href="${escapeAttr(a.website)}" target="_blank" rel="noopener">@ Web</a>` : ''}
        ${a.phone ? `<a class="link-btn website" href="tel:${escapeAttr(a.phone.replace(/\s/g,''))}">📞 ${escapeHtml(a.phone)}</a>` : ''}
      </div>`;
    }
    const BOOKING_PLATFORM_LABELS = {booking:'🛎️ Booking.com', airbnb:'🏡 Airbnb', abritel:'🔑 Abritel / Vrbo', expedia:'✈️ Expedia', hotels:'🏨 Hotels.com', direct:'📞 Réservation directe', autre:'Autre'};
    if(a.bookingPlatform && BOOKING_PLATFORM_LABELS[a.bookingPlatform]) siteNameBlock += `<div class="activity-annulation">${BOOKING_PLATFORM_LABELS[a.bookingPlatform]}</div>`;
    if(a.siteName) siteNameBlock += `<div class="activity-annulation">🏷️ ${escapeHtml(a.siteName)}</div>`;
    infoBlock = a.info ? `<div class="activity-block-label">Informations</div><div class="activity-notes">${escapeHtml(a.info)}</div>` : '';
    notesBlock = a.notes ? `<div class="activity-block-label">Un peu de culture...</div><div class="activity-notes activity-notes-alt">${escapeHtml(a.notes)}</div>` : '';
    imageBlock = a.image ? `<img src="${a.image}" class="activity-image" />` : '';
  }

  const displayTitle = isLocked ? '🎁 Surprise ??? ???' : escapeHtml(a.title || 'Sans titre');
  const displayIcon = isLocked ? renderIconSvg('surprise') : renderIconSvg(icon.id);
  const surpriseToggleBtn = a.surprise
    ? (isLocked
        ? `<button class="icon-btn" title="Révéler la surprise" onclick="unlockSurprise('${dayId}','${a.id}')">🔓</button>`
        : `<button class="icon-btn" title="Recacher la surprise" onclick="lockSurprise('${a.id}')">🔒</button>`)
    : '';

  const box1 = [gapLineFinal, addressBlock, parkingBlock].filter(Boolean).join('');
  const boxHoraires = quickMeta;
  const boxTarif = [priceLine, paymentBlock, cancellationBlock].filter(Boolean).join('');
  const box3 = attentionBlock;

  el.innerHTML = `
    <div class="activity-top">
      <div class="activity-number">${idx+1}</div>
      <div class="activity-icon">${displayIcon}</div>
      <div style="flex:1;">
        <div class="activity-title">${displayTitle} ${(!isLocked && a.alert) ? '<span class="activity-siren" title="Il reste quelque chose à faire">🚨</span>' : ''}</div>
        ${isLocked ? '' : `<div class="activity-cat">${cat.label}${a.countInTotals === false ? ' <span class="option-badge">🔀 Option (non comptée)</span>' : ''}</div>`}
      </div>
      <div class="activity-actions">
        ${surpriseToggleBtn}
        <button class="icon-btn" title="Monter" ${idx===0?'disabled style="opacity:.25;"':''} onclick="moveActivity('${dayId}','${a.id}',-1)">▲</button>
        <button class="icon-btn" title="Descendre" ${idx===total-1?'disabled style="opacity:.25;"':''} onclick="moveActivity('${dayId}','${a.id}',1)">▼</button>
        <button class="icon-btn" title="Dupliquer" onclick="duplicateActivity('${dayId}','${a.id}')">⧉</button>
        <button class="icon-btn" title="Modifier" onclick="openEditActivityModal('${dayId}','${a.id}')">✎</button>
      </div>
    </div>
    ${box1 ? `<div class="activity-box">${box1}</div>` : ''}
    ${imageBlock}
    ${boxHoraires ? `<div class="activity-box">${boxHoraires}</div>` : ''}
    ${boxTarif ? `<div class="activity-box">${boxTarif}</div>` : ''}
    ${box3 ? `<div class="activity-box">${box3}</div>` : ''}
    ${hikeBlock}
    ${linksBlock}
    ${siteNameBlock}
    ${infoBlock}
    ${notesBlock}
  `;
  return el;
}

function formatDate(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  }catch(e){ return iso; }
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  return (str||'').replace(/"/g,'&quot;');
}

function saveDay(){
  const title = document.getElementById('fDayTitle').value.trim() || 'Sans titre';
  const date = document.getElementById('fDayDate').value;
  const departure = document.getElementById('fDayDeparture').value;
  const weather = document.getElementById('fDayWeather').value.trim();
  const attention = document.getElementById('fDayAttention').value.trim();
  const morningAddress = document.getElementById('fDayMorningAddress').value.trim();
  const nextDeparture = document.getElementById('fDayNextDeparture').value;
  const nextInfo = document.getElementById('fDayNextInfo').value.trim();
  let savedDayId;
  if(editingDay){
    const d = state.days.find(x=>x.id===editingDay);
    d.title = title; d.date = date; d.color = pickedDayColor;
    d.departure = departure; d.weather = weather; d.attention = attention;
    d.morningAddress = morningAddress; d.nextDeparture = nextDeparture; d.nextInfo = nextInfo;
    savedDayId = d.id;
  } else {
    const nd = {id:uid(), title, date, color:pickedDayColor, departure, weather, attention, morningAddress, nextDeparture, nextInfo, activities:[]};
    state.days.push(nd);
    activeDayId = nd.id;
    savedDayId = nd.id;
  }
  if(nextDeparture){
    const idx = state.days.findIndex(x=>x.id===savedDayId);
    if(idx !== -1 && state.days[idx+1]){
      state.days[idx+1].departure = nextDeparture;
    }
  }
  saveState();
  closeDayModal();
  render();
}
function deleteDay(dayId){
  if(state.days.length<=1){ alert('Il doit rester au moins un jour.'); return; }
  if(!confirm('Supprimer ce jour et toutes ses activités ?')) return;
  state.days = state.days.filter(d=>d.id!==dayId);
  if(activeDayId===dayId) activeDayId = state.days[0].id;
  saveState();
  render();
}

function renderIconSelect(){

function renderWalkLegs(){
  const c = document.getElementById('walkLegsContainer');
  c.innerHTML = '';
  pickedWalkLegs.forEach((leg, idx)=>{
    const row = document.createElement('div');
    row.className = 'field-row walk-leg-row';

      ${idx>0 ? '<div class="walk-leg-plus">+</div>' : ''}
      <div class="field" style="flex:0 0 108px;">
        <select class="walkLegTransport"></select>

      ${pickedWalkLegs.length>1 ? '<button type="button" class="icon-btn trash" title="Retirer">🗑</button>' : ''}
    `;
    c.appendChild(row);

      const opt = document.createElement('option');
      opt.value = i.id;
      opt.textContent = i.symbol + ' ' + i.label;
      sel.appendChild(opt);
    });
    sel.value = leg.transport;
    sel.onchange = ()=>{ pickedWalkLegs[idx].transport = sel.value; };
    row.querySelector('.walkLegText').oninput = (e)=>{ pickedWalkLegs[idx].text = e.target.value; };

    if(trashBtn) trashBtn.onclick = ()=>removeWalkLeg(idx);
  });

function addWalkLeg(){
  pickedWalkLegs.push({transport:'voiture', text:''});
  renderWalkLegs();
}
function removeWalkLeg(idx){
  pickedWalkLegs.splice(idx,1);
  renderWalkLegs();
}
function getWalkLegs(a){
  if(Array.isArray(a.walkLegs) && a.walkLegs.length) return a.walkLegs;
  if(a.walk) return [{transport:a.walkTransport||'voiture', text:a.walk}];
  return [];
}

function handleImageFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pickedImage = canvas.toDataURL('image/jpeg', 0.72);
      renderImagePreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removePickedImage(){
  pickedImage = '';
  document.getElementById('fImageInput').value = '';
  renderImagePreview();
}
function renderImagePreview(){
  const wrap = document.getElementById('fImagePreviewWrap');
  const img = document.getElementById('fImagePreview');
  if(pickedImage){
    img.src = pickedImage;
    wrap.style.display = 'block';
  } else {
    img.src = '';
    wrap.style.display = 'none';
  }
}

  const d = state.days.find(x=>x.id===dayId);
  const a = d.activities.find(x=>x.id===activityId);

    render();

  }

}
function saveActivity(){
  const d = state.days.find(x=>x.id===editingActivity.dayId);
  const payload = {
    category: pickedCat,
    icon: pickedIcon,
    timeStart: document.getElementById('fTimeStart').value,
    timeEnd: document.getElementById('fTimeEnd').value,
    duration: document.getElementById('fDuration').value.trim(),
    walkLegs: pickedWalkLegs.filter(l=>l.text && l.text.trim()).map(l=>({transport:l.transport, text:l.text.trim()})),
    walk: (pickedWalkLegs[0] && pickedWalkLegs[0].text ? pickedWalkLegs[0].text.trim() : ''),
    walkTransport: (pickedWalkLegs[0] ? pickedWalkLegs[0].transport : 'voiture'),
    title: document.getElementById('fTitle').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    price: document.getElementById('fPrice').value.trim(),
    priceType: document.getElementById('fPriceType').value,
    paymentMethod: document.getElementById('fPaymentMethod').value,
    paymentStatus: document.getElementById('fPaymentStatus').value,
    paymentOther: document.getElementById('fPaymentOther').value.trim(),
    cashbackSite: document.getElementById('fCashbackSite').value.trim(),
    cashbackPercent: document.getElementById('fCashbackPercent').value.trim(),
    cashbackAmount: document.getElementById('fCashbackAmount').value.trim(),
    hike: document.getElementById('fHike').value.trim(),
    ticket: document.getElementById('fTicket').value.trim(),
    website: document.getElementById('fWebsite').value.trim(),
    siteName: document.getElementById('fSiteName').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    bookingPlatform: document.getElementById('fBookingPlatform').value,
    cancellation: document.getElementById('fCancellation').value.trim(),
    attention: document.getElementById('fAttention').value.trim(),
    info: document.getElementById('fInfo').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    alert: document.getElementById('fAlert').checked,
    countInTotals: document.getElementById('fCountInTotals').checked,
    surprise: document.getElementById('fSurprise').checked,
    surprisePassword: document.getElementById('fSurprisePassword').value,
    image: pickedImage,
    parking: {
      type: document.getElementById('fParkingType').value,
      price: document.getElementById('fParkingPrice').value.trim(),
      addresses: document.getElementById('fParkingAddresses').value.trim(),
    },
  };
  if(editingActivity.activityId){
    const a = d.activities.find(x=>x.id===editingActivity.activityId);
    Object.assign(a, payload);
  } else {
    payload.id = uid();
    d.activities.push(payload);
  }
  saveState();
  closeActModal();
  render();
}
function deleteActivity(){
  const d = state.days.find(x=>x.id===editingActivity.dayId);
  d.activities = d.activities.filter(x=>x.id!==editingActivity.activityId);
  saveState();
  closeActModal();
  render();
}
function duplicateActivity(dayId, activityId){
  const d = state.days.find(x=>x.id===dayId);
  const idx = d.activities.findIndex(x=>x.id===activityId);
  if(idx===-1) return;
  const copy = Object.assign({}, d.activities[idx], {id:uid(), title:(d.activities[idx].title||'Sans titre')+' (copie)'});
  d.activities.splice(idx+1, 0, copy);
  saveState();
  render();
}
function moveActivity(dayId, activityId, dir){
  const d = state.days.find(x=>x.id===dayId);
  const idx = d.activities.findIndex(x=>x.id===activityId);
  const newIdx = idx + dir;
  if(idx===-1 || newIdx<0 || newIdx>=d.activities.length) return;
  const tmp = d.activities[idx];
  d.activities[idx] = d.activities[newIdx];
  d.activities[newIdx] = tmp;
  saveState();
  render();
}
